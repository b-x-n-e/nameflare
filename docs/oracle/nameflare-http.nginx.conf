# Initial HTTP-only site; replace with nameflare.nginx.conf after TLS issuance.
server {
    listen 80;
    server_name nameflare.bxne.dev;
    access_log off;
    error_log /var/log/nginx/nameflare-error.log crit;
    client_max_body_size 3m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /.well-known/acme-challenge/ {
        root /var/www/nameflare-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Nameflare is being configured. Please try again later.\n";
    }
}
