# Include from nginx's http context (Ubuntu sites-available/sites-enabled).
# Do not enable until the certificate files below exist.
#
# Edge rate limits: nginx turns away floods before they reach Node, which runs
# its own per-client budgets behind this (server.js `rate`). Limits apply per
# client: one IPv4 address, or one IPv6 /64. A home or mobile connection is
# usually handed a whole /64, so a per-address IPv6 limit would be trivial to
# dodge. scripts/check-edge-limits.mjs checks these rules against a real nginx.
map $remote_addr $nameflare_client {
    "~^(?<v4>\d+\.\d+\.\d+\.\d+)$"                                     $v4;
    "~*^(?<p4>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"               $p4;
    "~*^(?<p3>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"                        $p3:0;
    "~*^(?<p2>[0-9a-f]+:[0-9a-f]+)::"                                  $p2:0:0;
    "~*^(?<p1>[0-9a-f]+)::"                                            $p1:0:0:0;
    "~^::"                                                             0:0:0:0;
    default                                                            $remote_addr;
}

# API, sign-in and image reads. A first page load fetches ~130 static files,
# which are left out: Node serves them from memory with ETags.
limit_req_zone $nameflare_client zone=nameflare_api:10m rate=10r/s;
# Writes: everything except reads and overlay identity lookups (Node gives
# them their own 240/min budget).
map "$request_method:$uri" $nameflare_write_key {
    default $nameflare_client;
    "~^(GET|HEAD|OPTIONS):" "";
    "POST:/api/v1/resolve" "";
}
limit_req_zone $nameflare_write_key zone=nameflare_writes:10m rate=40r/m;
# Image uploads are decoded and rebuilt, the most expensive request there is.
limit_req_zone $nameflare_client zone=nameflare_uploads:10m rate=12r/m;
# OAuth starts and callbacks: a person signs in a few times, not dozens.
limit_req_zone $nameflare_client zone=nameflare_auth:10m rate=20r/m;
limit_conn_zone $nameflare_client zone=nameflare_conn:10m;

# Reuse connections to Node instead of opening one per request. Node's own
# keep-alive timeout is 5s, so Nginx lets idle ones go first.
upstream nameflare_node {
    server 127.0.0.1:3000;
    keepalive 16;
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name nameflare.bxne.dev;
    access_log off;
    location /.well-known/acme-challenge/ {
        root /var/www/nameflare-acme;
    }
    location / {
        return 301 https://nameflare.bxne.dev$request_uri;
    }
}

server {
    # HTTP/2 multiplexes the many module requests over one connection.
    listen 443 ssl http2;
    server_name nameflare.bxne.dev;
    ssl_certificate /etc/letsencrypt/live/nameflare.bxne.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nameflare.bxne.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Resumed sessions skip the full handshake, the costliest part of TLS on a
    # fractional-OCPU host.
    ssl_session_cache shared:nameflare_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # The browser queues anything past 32 streams itself, so a page with 130+
    # modules waits its turn instead of being turned away by limit_conn below.
    http2_max_concurrent_streams 32;
    keepalive_timeout 30s;
    client_max_body_size 3m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    # Under HTTP/2 every in-flight stream counts as a connection. With 64 here
    # and 64 streams per connection, a page load on a slow link went over and
    # random modules or the catalog request got 429 (Discover "half the time").
    # 128 leaves room for four full connections per visitor.
    limit_conn nameflare_conn 128;
    # Turned-away requests get the same JSON shape and Retry-After as Node's.
    error_page 429 = @nameflare_429;
    # No URI access logs: OAuth callback codes are sensitive.
    access_log off;
    error_log /var/log/nginx/nameflare-error.log crit;

    location @nameflare_429 {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":"Too many requests. Try again in a few seconds."}';
    }
    location = /api/textures {
        limit_req zone=nameflare_uploads burst=4 nodelay;
        limit_req zone=nameflare_writes burst=10 nodelay;
        proxy_pass http://nameflare_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_cache off;
        # Decoding a large animated image can take a while on this CPU.
        proxy_read_timeout 60s;
    }
    location /auth/ {
        limit_req zone=nameflare_auth burst=10 nodelay;
        proxy_pass http://nameflare_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 30s;
    }
    location ~ ^/(api|textures)/ {
        limit_req zone=nameflare_api burst=40 nodelay;
        limit_req zone=nameflare_writes burst=10 nodelay;
        proxy_pass http://nameflare_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 30s;
    }
    # Pages, modules, styles and fonts: served from Node's memory cache with
    # ETags, bounded by the connection limit above.
    location / {
        limit_req zone=nameflare_writes burst=10 nodelay;
        proxy_pass http://nameflare_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 30s;
    }
}
